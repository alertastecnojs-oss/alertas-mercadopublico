name: Alerta diaria Mercado Público

on:
  schedule:
    # 12:00 UTC ≈ 08:00-09:00 hora de Chile continental (según horario de verano).
    # Se ejecuta de lunes a sábado (1-6).
    - cron: '0 12 * * 1-6'
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde la pestaña Actions para probar

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # red de seguridad: si algo se cuelga, GitHub lo corta solo
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de alertas
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python alerta_mercadopublico.py
